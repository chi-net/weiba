# weiba configuration
# 2 modes to choose
# 1. config, read this yaml file
# 2. environment variable 'env', it is useful in passing credentials into container(Partial support)
mode: "config"
# env variable BOT_TOKEN
bot_token: "{YOUR TELEGRAM BOT TOKEN}"
# administrator's Telegram UID, if you do not know your Telegram UID, please STFW.(specify -1 will disable this feature.)
# env variable ADMIN_UID
admin_uid: -1
# This field is served for `gic_auth`
# if you do not modify this option in your convert.py, please DO NOT EDIT this field.
# env variable TRANSFORM_DIGITS, this is optional(default 4)
transform_digits: 4
# Now We use features field to manage feature enable.
# You can edit each feature's whitelist under the whitelists field.
features:
  # We added GIC_Auth as an optional feature now!
  # if you want to enable it, you can see README to generate data.json and place it in the same menu of the executable.
  # If this option is disabled, it
  gic_auth: false
  # A little hint feature: Enhanced monitor channel/group's subscribers/members
  # If there is someone quitting your channel/group, you can get updates from the bot.
  # And when someone is joining your channel/group directly, you can also get informed.
  monitor_members: false
  # unpin the group's channel pin automatically!
  # Please note that you should specify which group will be influenced.(If the field is empty, it won't take any effect.)
  unpin_channel_posts: false
  # anonymous chat
  # If you are seeking for solutions like livegram, it is a good alternative for livegram since it's an opensource project.
  # If this feature enabled, you can use /chat to chat with administrator.
  # You should specify admin_uid field if you enable this feature.
  # Administrator can simply reply that message sent to them to reply user messages and chat.
  anonymous_chat: false
  # tietie feature
  # when you send "/[content]" in a chat that bot exists, it will reply you [sender] [content] [reply].
  # It is normally opened.
  tietie: true
  # waifu feature
  # you can choose your wife randomly with this simple "/waifu" console.
  waifu: false
  # Debug feature
  # If you want to receive more debuggable messages, please open this!
  # You should specify admin_uid field if you enable this feature.
  debug: true

# You can get it via bot's command /chatid in any group, or manually check it in admin's response.
# If the field is empty, it will automatically take it as no whitelist, I DO NOT recommend you to do that!
# Except unpin_channel_posts, if there is no group id specified, it won't take any effect.
whitelists:
  gic_auth:
    - -1000000000000
  monitor_members:
    - -1000000000000
  unpin_channel_posts:
    - -1000000000000
